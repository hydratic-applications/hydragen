name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and matching LLVM tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Run tests and generate line coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --locked --workspace --all-targets --lcov --output-path target/coverage/lcov.info

      - name: Validate library and CLI coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          report = Path("target/coverage/lcov.info").read_text()
          sources_with_hits = set()
          for record in report.split("end_of_record"):
              lines = record.splitlines()
              source = next((line[3:] for line in lines if line.startswith("SF:")), None)
              hits = any(int(line.split(",")[1]) > 0 for line in lines if line.startswith("DA:"))
              if source and hits:
                  sources_with_hits.add(Path(source).resolve())
          for source in ("src/lib.rs", "src/main.rs"):
              if Path(source).resolve() not in sources_with_hits:
                  raise SystemExit(f"Coverage report is missing executed lines for {source}")
          print("LCOV contains executed library and CLI source lines.")
          PY

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Explain skipped fork upload
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fork PR: instrumented tests and LCOV validation passed. Uploading is disabled for fork PRs; no Codecov assessment was requested.' >> "$GITHUB_STEP_SUMMARY"
