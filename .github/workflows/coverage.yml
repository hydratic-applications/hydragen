name: Coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
  COVERAGE_EVENT: ${{ github.event_name }}
  COVERAGE_REPOSITORY: ${{ github.repository }}
  COVERAGE_RUN_ID: ${{ github.run_id }}
  COVERAGE_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  coverage:
    name: Generate coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out measured head and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COVERAGE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and retain coverage evidence
        uses: ./.github/actions/coverage-report

  total:
    name: Check total coverage
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the same immutable head and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COVERAGE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assess total coverage
        uses: ./.github/actions/coverage-check
        with:
          mode: total

  changed:
    name: Check changed-line coverage
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the same immutable head and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COVERAGE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assess changed-line coverage
        uses: ./.github/actions/coverage-check
        with:
          mode: changed
