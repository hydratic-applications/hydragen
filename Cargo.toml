[package]
name = "hydragen"
version = "0.1.0"
edition = "2024"
description = "Build distinct projects from shared layers"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
cliclack = "0.5.6"
console = "0.16"
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
jsonc-parser = "0.34"
jsonschema = { version = "0.59.0", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize", "comments"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
whoami = { version = "=2.1.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
portable-pty = "0.9"
