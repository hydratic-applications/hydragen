[package]
name = "hydragen"
version = "0.1.0"
edition = "2024"
description = "Build distinct projects from shared layers"

[dependencies]
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.6"
console = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
